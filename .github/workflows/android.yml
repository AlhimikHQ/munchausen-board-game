name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Firebase and game tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - run: npm install --no-audit --no-fund
      - run: npm --prefix functions install --no-audit --no-fund
      - run: npm test

  build:
    name: Build small updateable APK
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare the fixed public debug signature
        run: base64 --decode android/munchausen-debug.keystore.base64 > android/munchausen-debug.keystore

      - name: Build optimized APK
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: Remove generated keystore
        if: always()
        run: rm -f android/munchausen-debug.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: munchausen-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
