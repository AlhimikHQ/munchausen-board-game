plugins {
    id 'com.android.application'
}

def githubRunNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '0').toInteger()

android {
    namespace 'ru.munchausen.game'
    compileSdk 34

    defaultConfig {
        applicationId 'ru.munchausen.game'
        minSdk 26
        targetSdk 34
        versionCode 1000 + githubRunNumber
        versionName '1.3'
    }

    signingConfigs {
        release {
            storeFile rootProject.file('munchausen-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            assets.srcDirs = ['../../docs']
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
