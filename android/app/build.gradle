plugins {
    id 'com.android.application'
}

// The CI run number makes every distributed APK upgradeable over the previous one.
def githubRunNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '0').toInteger()
def generatedVersionCode = githubRunNumber > 0 ? 1000 + githubRunNumber : 4
def signingStorePath = System.getenv('ANDROID_KEYSTORE_PATH')

android {
    namespace 'ru.munchausen.game'
    compileSdk 34

    defaultConfig {
        applicationId 'ru.munchausen.game'
        minSdk 26
        targetSdk 34
        versionCode generatedVersionCode
        versionName '1.3'
    }

    signingConfigs {
        release {
            if (signingStorePath) {
                storeFile file(signingStorePath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            // Local debug builds remain convenient. Distributed builds use the stable release key.
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The Android shell packages the same page that is published by GitHub Pages.
    sourceSets {
        main {
            assets.srcDirs = ['../../docs']
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
