plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.munchausen.game'
    compileSdk 34

    defaultConfig {
        applicationId 'ru.munchausen.game'
        minSdk 26          // Android 8.0 и выше
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Игра — одна страница: берём её из папки docs репозитория (та же, что для GitHub Pages)
    sourceSets {
        main {
            assets.srcDirs = ['../../docs']
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
