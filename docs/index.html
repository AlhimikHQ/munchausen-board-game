<style>

<script>
const CW=100/9,TH=1316;let CH=117.5/13.16;
const COL=['#e02020','#1e5bff','#1faa3c','#ffe94d','#ffffff'];
// Правила клеток: от→[куда, анимация, эмодзи]. Красные — вперёд, синие — назад. Редактируется здесь.
const J={5:[9,'ride','🐎'],11:[15,'ride','🏇'],17:[50,'fly','🦆'],23:[47,'fly','💣'],27:[63,'climb','🌱'],35:[38,'jump','🐴'],39:[43,'fly','🦆'],49:[53,'ride','🐎'],51:[55,'fly','🦆'],71:[84,'fly','💣'],73:[89,'ride','⛵'],85:[93,'fly','⛵'],
21:[3,'fall','⛪'],36:[18,'fall','💦'],48:[22,'fall','🏰'],50:[25,'fall','🦆'],62:[26,'fall','🧗'],60:[58,'fall','🐋'],72:[67,'fall','🌊'],79:[57,'fall','☄️'],92:[59,'fall','🦅']};
const GR={41:1,98:1}; // зелёные кружки: пропуск одного хода
const $=s=>document.querySelector(s),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const board=$('#board');let P=[],cur=0,busy=false,over=false;
function xy(n){if(!n)return[0,11];let r=(n-1)/9|0,c=(n-1)%9;if(r%2)c=8-c;return[c,10-r]}

const GX=[6.8,115.5,224.5,333,442,550.5,659,768,876,984.7];
/* Фишки в клетке занимают места как точки на грани «5», сдвинутые вверх (внизу слева — круг с номером), строго в порядке прихода:
   1-я — по центру; 2-я встаёт между центром и кругом с номером; 3-я — правый верх (ряд по диагонали); 4-я и 5-я — оставшиеся углы.
   Фишки, которые уже стоят, не переставляются; фишка на каждом шаге занимает первое свободное место клетки, уходя — освобождает своё. */
const SEATQ=[[54.35,44.75],[21.5,68],[87.2,21.5],[21.5,21.5],[87.2,68]];
function seatFor(i,pos){const u=new Set();P.forEach((q,k)=>{if(k!=i&&q.pos==pos)u.add(q.seat)});let n=0;while(u.has(n))n++;return n}
function setPos(p,i,pos){p.pos=pos;p.seat=seatFor(i,pos)}
function slot(i,pos){const q=P[i],sd=Math.min(4,q.pos==pos&&q.seat!=null?q.seat:seatFor(i,pos)),[ux,uy]=SEATQ[sd],[c,rw]=xy(pos),x0=GX[c],x1=GX[c+1],y0=5.5+117.5*rw;return[(x0+(x1-x0)*ux/108.7)/10,(y0+uy)/(TH/100)]}
const pt=(n,i)=>slot(i,n);
function relayout(){P.forEach((q,k)=>{if(q.jmp)return;const[l,t]=slot(k,q.pos);q.e.style.left=l+'%';q.e.style.top=t+'%'})}
const DS=.0935,Wu=1/DS,Hu=1.316/DS,SX=Wu/2,G=60,I1=6,DU=1e9,HH=1/120,KA=1,KB=1,NK=15,AD=0,VMAX=26,CQ=.07,CWR=.05,SK=1.35,YAW=7;
const VAL=[1,6,3,4,2,5],PP={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
const FT=['','rotateY(180deg)','rotateY(90deg)','rotateY(-90deg)','rotateX(90deg)','rotateX(-90deg)'];
const vl=document.createElement('div');vl.id='vl';vl.innerHTML='<div id="vsh"></div><div id="cube"></div>';board.appendChild(vl);
const cube=vl.querySelector('#cube'),sh=vl.querySelector('#vsh');
FT.forEach((t,k)=>{const f=document.createElement('div');f.className='f f'+VAL[k];f.style.transform=t+' translateZ(calc(var(--s) / 2))';
for(let i=0;i<9;i++){const q=document.createElement('i');if(PP[VAL[k]].includes(i))q.className='p';f.appendChild(q)}cube.appendChild(f)});
/* ---- физика твёрдого тела (без выделения памяти). Состояние: [0-2]p [3-5]v [6-8]w [9-17]R [18]шаг [19]покой [20]шаг-толчка [21-23]толчок ---- */
const newS=()=>{const s=new Float64Array(24);s[0]=SX;s[1]=Hu-.62;s[2]=.5;s[9]=1;s[13]=1;s[17]=1;s[20]=-1;return s};
let REC=false,IG=0,IW=0;let S=newS();const T=new Float64Array(24),RV=new Float64Array(24),Cc=new Float64Array(24);
function hit1(i,nx,ny,nz,d,e,mu){const rx=RV[i],ry=RV[i+1],rz=RV[i+2];
let vcx=T[3]+T[7]*rz-T[8]*ry,vcy=T[4]+T[8]*rx-T[6]*rz,vcz=T[5]+T[6]*ry-T[7]*rx;const un=nx*vcx+ny*vcy+nz*vcz;
if(un<0){if(REC&&-un>.6){if(nz===1){if(-un>IG)IG=-un}else if(-un>IW)IW=-un}const rnx=ry*nz-rz*ny,rny=rz*nx-rx*nz,rnz=rx*ny-ry*nx,j=-(1+(un<-1.5?e:0))*un/(1+I1*(rnx*rnx+rny*rny+rnz*rnz));
T[3]+=j*nx;T[4]+=j*ny;T[5]+=j*nz;T[6]+=I1*j*rnx;T[7]+=I1*j*rny;T[8]+=I1*j*rnz;
vcx=T[3]+T[7]*rz-T[8]*ry;vcy=T[4]+T[8]*rx-T[6]*rz;vcz=T[5]+T[6]*ry-T[7]*rx;const u2=nx*vcx+ny*vcy+nz*vcz,
utx=vcx-u2*nx,uty=vcy-u2*ny,utz=vcz-u2*nz,m=Math.sqrt(utx*utx+uty*uty+utz*utz);
if(m>1e-6){const tx=utx/m,ty=uty/m,tz=utz/m,rtx=ry*tz-rz*ty,rty=rz*tx-rx*tz,rtz=rx*ty-ry*tx,jt=Math.min(m/(1+I1*(rtx*rtx+rty*rty+rtz*rtz)),mu*j);
T[3]-=jt*tx;T[4]-=jt*ty;T[5]-=jt*tz;T[6]-=I1*jt*rtx;T[7]-=I1*jt*rty;T[8]-=I1*jt*rtz}}
T[0]-=d*nx*.5;T[1]-=d*ny*.5;T[2]-=d*nz*.5}
function contacts(){const px=T[0],py=T[1],pz=T[2];
for(let i=0;i<24;i+=3){const d=pz+RV[i+2];if(d<0)hit1(i,0,0,1,d,.5,.8)}
if(px<1.4||px>Wu-1.4||py<1.4||py>Hu-1.4){for(let i=0;i<24;i+=3){const x=T[0]+RV[i],y=T[1]+RV[i+1],z=T[2]+RV[i+2],q=Math.max(0,(z-.5)/DU);let d;
d=x-(Wu/2*q+.03);if(d<0)hit1(i,1,0,0,d,.98,.02);d=(Wu-Wu/2*q-.03)-x;if(d<0)hit1(i,-1,0,0,d,.98,.02);
d=y-(Hu/2*q+.03);if(d<0)hit1(i,0,1,0,d,.98,.02);d=(Hu-Hu/2*q-.03)-y;if(d<0)hit1(i,0,-1,0,d,.98,.02)}}}
function runSteps(Sx,cnt){T.set(Sx);let rest=false;
for(let s=0;s<cnt;s++){if(T[18]===T[20]){T[6]+=T[21];T[7]+=T[22];T[8]+=T[23];T[20]=-1}

async function createRoom(){

  roomMaxPlayers=Math.max(2,Math.min(5,Number(np)||3));roomStarting=false;roomStartPending=false;

  let code='';const tried=new Set();

   do{code=makeRoomCode();}while(tried.has(code)&&tried.size<216);
   tried.add(code);const candidate=firebase.database().ref('rooms/'+code);
   const existing=await withTimeout(candidate.child('meta').once('value'),8000,'Firebase room code lookup timeout');
   if(existing.exists())continue;
   try{

   }catch(e){

async function joinRoom(){

 const refuse=message=>showRoomToast(message,5500);

  if(!(await withTimeout(ensureAuth(),12000,'Firebase authentication timeout')))return;if(stale())return;
  const code=joinDiceValues.join('');if(!roomCodeValid(code)){refuse('🎲❓');return;}ref=firebase.database().ref('rooms/'+code);
  const metaSnap=await withTimeout(ref.child('meta').once('value'),12000,'Firebase room lookup timeout');
  if(stale())return;

  const meta=metaSnap.val()||{};
  if(meta.schema!==FIREBASE_SCHEMA){refuse('⚠️🔄');return;}
  if(meta.status==='closed'){refuse('🏠🔒');return;}
  roomMaxPlayers=Math.max(2,Math.min(5,Number(meta.maxPlayers)||0));if(roomMaxPlayers<2){refuse('🏠⚠️');return;}
  const memberRef=ref.child('members/'+fbUser.uid),existing=await withTimeout(memberRef.once('value'),12000,'Firebase membership lookup timeout');
  let member=existing.val();
  if(member){
   /* этот игрок уже сидит в комнате (перезагрузка страницы, второе окно) — просто возвращаем его на своё место */
   claimedSeat=Number(member.seat);if(!Number.isInteger(claimedSeat)||claimedSeat<0||claimedSeat>=roomMaxPlayers){refuse('👤❓');return;}
  }else{
   if(meta.status!=='lobby'){refuse('▶️🚫');return;}
   /* Сначала пробуем места 1..max-1, потом 0: место 0 почти всегда у хоста, а transaction по чужому слоту
      без права чтения даёт permission-denied и в части SDK срывает цикл занятия места. */
   const seatOrder=[];
   for(let s=1;s<roomMaxPlayers;s++)seatOrder.push(s);
   seatOrder.push(0);
   const tryClaim=async seat=>{
    const slotRef=ref.child('slots/'+seat);

    try{
     const snap=await withTimeout(slotRef.once('value'),8000,'Firebase seat lookup timeout');
     if(snap.exists())return -1;
    }catch(readErr){
     if(netErr(readErr)==='permission-denied')return -1;
     throw readErr;
    }
    try{
     const tx=await withTimeout(slotRef.transaction(current=>current===null?{uid:fbUser.uid,seat,joinedAt:Date.now()}:undefined,null,false),10000,'Firebase seat claim timeout');
     if(tx&&tx.committed)return seat;

     if(netErr(slotError)!=='permission-denied')throw slotError;

   };
   for(const seat of seatOrder){

   }
   /* Повтор при гонке двух гостей за одно место */
   if(claimedSeat<0){
    for(const seat of seatOrder){
     claimedSeat=await tryClaim(seat);
     if(claimedSeat>=0)break;
    }
   }
   if(claimedSeat<0){refuse('👥🚫');return;}
   member={name:'P'+(claimedSeat+1),ready:false,seat:claimedSeat,joinedAt:Date.now(),connected:true,lastSeenAt:Date.now()};
   createdMember=true;
   try{
    await withTimeout(memberRef.set(member),10000,'Firebase membership write timeout');
   }catch(memberErr){
    try{await ref.child('slots/'+claimedSeat).remove();}catch(ignore){}
    throw memberErr;
   }
  }
  if(stale()){if(createdMember){try{await memberRef.remove();await ref.child('slots/'+claimedSeat).remove();}catch(e){}}return;}
  await memberRef.update({connected:true,lastSeenAt:Date.now()});

  await armRoomDisconnect(ref,fbUser.uid,hostHere);

  showRoomCode(code);watchMembers();watchRoomState();
  updateLobbyControls();
 }catch(e){
  reportFirebase('🚪',e);
  if(createdMember&&ref&&claimedSeat>=0){try{await ref.child('members/'+fbUser.uid).remove();await ref.child('slots/'+claimedSeat).remove();}catch(ignore){}}
 }finally{roomJoinPending=false;applyNetUi();}
}

function fit(){const w=$('#boardw'),W=w.clientWidth,H=w.clientHeight;
/* в игре снизу резервируем место под список из 5 строк: cw·(1.316 + 6·DS) = H − 20 */
const cw=Math.min(W-6,started?(H-20)/(1.316+6*DS):(H-6-68)/1.316),x=cw+6,ox=(W-x)/2,bh=cw*1.316+6;
board.style.width=x+'px';board.style.height=bh+'px';
/* единые размеры: кубик DIE — ровно как кубик на доске; фишка TOK = 1.2 × кубик (в меню, списке, итогах); подсветка кубика HALO = 3 × кубик */
const DIE=cw*DS,TOK=1.2*DIE,HALO=3*DIE,R=document.documentElement.style,WC=6*DIE;
R.setProperty('--die',DIE+'px');R.setProperty('--tok',TOK+'px');R.setProperty('--halo',HALO+'px');R.setProperty('--cube',2*DIE+'px');window.TOK=TOK;window.WC=WC;
/* кубик с подсветкой: равные отступы сверху (от доски), снизу и справа, но не заходит на список */
const avail=Math.max(HALO+8,innerHeight-(w.getBoundingClientRect().top+bh)),m=(avail-HALO)/2,pr=Math.max(4,Math.min(m,x-HALO/2-.87*DIE-14-WC));
bn.style.cssText='left:'+ox+'px;width:'+x+'px;top:'+(bh+m)+'px;height:'+HALO+'px;padding-right:'+pr+'px';
if(!V.touched){S[0]=SX;S[1]=Hu-.62;S[2]=.5}
layoutDL();vfit()}
new ResizeObserver(fit).observe($('#boardw'));addEventListener('resize',fit);
const CG='#2e9e4a',CR='#e53935',CB='#1e6fe0';
function dieImg(n){const P3={1:[[1,1]],2:[[0,0],[2,2]],3:[[0,0],[1,1],[2,2]],4:[[0,0],[2,0],[0,2],[2,2]],5:[[0,0],[2,0],[1,1],[0,2],[2,2]],6:[[0,0],[2,0],[0,1],[2,1],[0,2],[2,2]]};return'<svg viewBox="0 0 22 22"><rect x=".7" y=".7" width="20.6" height="20.6" rx="4" fill="#fff" stroke="#000" stroke-width="1.4"/>'+P3[n].map(p=>'<circle cx="'+(5.5+p[0]*5.5)+'" cy="'+(5.5+p[1]*5.5)+'" r="'+(n==1?2.6:1.9)+'" fill="'+(n==1?'#c0202a':'#111')+'"/>').join('')+'</svg>'}
const cb=(c,v,t)=>'<span class="cb'+(v==0?' z':'')+'" style="background:'+c+'">'+(t==null?v:t)+'</span>';
function showRes(){hideDL();const r=document.createElement('div');r.id='res';
const rows=ORD.map((k,n)=>{const s=P[k].st;return'<tr><td class="pl"><span class="dt" style="background:'+COL[k]+'"></span>'+ROM[n]+'</td><td>'+s.n+'</td>'+s.v.map(v=>'<td>'+v+'</td>').join('')+'<td>'+cb(CR,s.up)+'</td><td>'+cb(CB,s.dn)+'</td><td>'+cb(CG,s.sk)+'</td></tr>'}).join('');
r.innerHTML='<div class="card"><h2>🏁</h2><table><thead><tr><th>🏆</th><th>👣</th>'+[1,2,3,4,5,6].map(n=>'<th>'+dieImg(n)+'</th>').join('')+'<th>'+cb(CR,1,'↑')+'</th><th>'+cb(CB,1,'↓')+'</th><th>'+cb(CG,1,'')+'</th></tr></thead><tbody>'+rows+'</tbody></table>'+
'<button onclick="again()">🔄</button></div>';$('#boardw').appendChild(r);{const t=r.querySelector('table'),k=Math.min(1,(innerWidth-24)/t.offsetWidth);if(k<1)t.style.zoom=k}}
let mode,dl,di,dr,started=false;const bn=document.createElement('div');bn.id='bn';$('#boardw').appendChild(bn);
let bHold=0,bQ=[];
function bk(i,inner,nt){return'<span class="bk">'+(nt?'':'<i class="bkc" style="--hc:'+COL[i]+'"></i>')+'<span class="bkd">'+inner+'</span></span>'}
function dieIso(){const pip=(x,y,c)=>'<circle cx="'+x+'" cy="'+y+'" r=".105" fill="'+(c||'#111')+'"/>',g=(m,b)=>'<g transform="matrix('+m+')">'+b+'</g>';
return'<svg viewBox="0 0 100 100"><path d="M50 0L93.3 25L50 50L6.7 25Z" fill="#fff"/><path d="M6.7 25L50 50L50 100L6.7 75Z" fill="#dcdcdc"/><path d="M50 50L93.3 25L93.3 75L50 100Z" fill="#b9b9b9"/>'
+g('43.3 25 -43.3 25 50 0',pip(.5,.5,'#c0202a').replace('.105','.13'))+g('43.3 25 0 50 6.7 25',pip(.27,.27)+pip(.73,.73))+g('43.3 -25 0 50 50 50',pip(.27,.27)+pip(.5,.5)+pip(.73,.73))
+'<path d="M50 0L93.3 25L93.3 75L50 100L6.7 75L6.7 25Z M6.7 25L50 50L93.3 25 M50 50L50 100" fill="none" stroke="#000" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/></svg>'}
function bnHTML(t,i){if(t.indexOf('● ')==0){const r=t.slice(2);return bk(i,r.indexOf('🎲')>=0?'<span class="bdie">'+dieIso()+'</span>':'<span class="bsy">'+r+'</span>')}return bk(i,'<span class="bsy">'+t+'</span>',1)}
function banner(t,i,hold,h){const now=Date.now();if(now<bHold){bQ.push([t,i,hold,h]);return}
if(h!=null)bn.innerHTML=h;else bn.innerHTML=bnHTML(t,i);bn.style.color=COL[i];bn.classList.remove('sh');void bn.offsetWidth;bn.classList.add('sh');
if(hold){bHold=now+hold;setTimeout(()=>{bHold=0;while(bQ.length){const q=bQ.shift();banner(q[0],q[1],q[2],q[3]);if(q[2])break}},hold)}}
function drawRoll(v){const i=dl[di];(DRES[i]=DRES[i]||[]).push(v);banner(' ',i,1100,bk(i,dieImg(v)));showDL();di++;
if(di<dl.length){const k=dl[di];banner('● 🎲 ?',k);act(k);busy=false;return}
const G={};Object.keys(DRES).forEach(k=>{const y=DRES[k].join();(G[y]=G[y]||[]).push(+k)});
const tied=[].concat(...Object.values(G).filter(g=>g.length>1)).sort((a,b)=>a-b);
if(tied.length){dl=tied;di=0;banner('🔁',tied[0],1300);banner('● 🎲 ?',tied[0]);act(tied[0]);busy=false;return}
TO=rankList();LB=[...TO];mode='play';cur=TO[0];busy=false;showDL(true);banner('● 🎲',cur);act(cur)}
async function play(roll){if(!Number.isInteger(roll)||roll<1||roll>6||busy||over)return;busy=true;V.armed=false;
if(mode=='draw')return drawRoll(roll);
const i=cur,p=P[i];if(p.anim)await p.anim;
let pos=p.pos,dir=1;const path=[];for(let k=0;k<roll;k++){pos+=dir;if(pos>99){pos=98;dir=-1}path.push(pos)}
const last=pos,j=last==99?null:J[last],dest=j?j[0]:last;p.st.n++;p.st.v[roll-1]++;if(j){if(j[0]>last)p.st.up++;else p.st.dn++}leaders();
p.anim=new Promise(r=>p._r=r);
for(let k=0;k<path.length;k++){
if(k==path.length-1){if(GR[dest]&&!j)failSnd();if(last==99)fin(i);else{if(GR[dest])p.skip=1;next()}} /* как только фишка шагнула на последнюю клетку — сразу ход следующего */
setPos(p,i,path[k]);relayout();stepSnd();await sleep(300)}
if(j){p.jmp=true;await jump(p,i,last,j[0],j[1],j[2]);setPos(p,i,j[0]);p.jmp=false;relayout();if(GR[dest])failSnd()}
leaders();p._r();p.anim=null}
function next(){let g=0;do{cur=TO[(TO.indexOf(cur)+1)%TO.length];const q=P[cur];if(q.done)continue;
if(q.skip){q.skip=0;q.st.sk++;banner('● ⏭',cur,900);continue}
break}while(++g<30);
busy=false;banner('● 🎲',cur);act(cur)}
const ORD=[];
function fin(i){const p=P[i];p.done=ORD.push(i);if(p.done==1)fanfare();else if(p.done==2)fanfare2();else if(p.done==3)fanfare3();if(ORD.length==P.length-1){const l=P.findIndex(q=>!q.done);P[l].done=ORD.push(l)}
leaders();
if(ORD.length==P.length){over=true;busy=false;banner('🏁',ORD[0]);act(-1);setTimeout(showRes,2300);return}
next()}

const ROM=['I','II','III','IV','V'];
/* нажатие по кубику в нижней надписи = нажатие по кубику на доске: кубик катится от места, где лежит, к центру доски */
let tapT=0;addEventListener('pointerdown',e=>{const t=e.target;if(!(t&&t.closest&&t.closest('.bdie'))||!awaiting())return;e.preventDefault();const nw=Date.now();if(V.on||V.armed||nw-tapT<900)return;tapT=nw;
const dx=Wu/2-S[0],dy=Hu*.45-S[1],m=Math.hypot(dx,dy);launch(m>.5?dx/m:0,m>.5?dy/m:-1,13+Math.random()*8,0,[45,.35])});

/* ---- жребий: места вертикальным списком (римские цифры, цвет фишки, выпавшее число); строки плавно меняются местами ---- */
let TO=[],DRES={},DLE=null,LB=[];
/* постоянный список лидеров: места от жребия, затем по продвижению к 99 (финишировавшие — по порядку финиша); справа — число ходов */
function leaders(){if(!LB.length)LB=[...TO];const prev=LB.slice(),key=k=>{const p=P[k];return p.done?[0,p.done]:[1,-p.pos]};
LB=prev.slice().sort((a,b)=>{const A=key(a),B=key(b);return A[0]-B[0]||A[1]-B[1]||prev.indexOf(a)-prev.indexOf(b)});showDL(true,LB,1)}
function rankList(){return Object.keys(DRES).map(Number).sort((a,b)=>{const A=DRES[a],B=DRES[b];for(let i=0;i<Math.max(A.length,B.length);i++){const x=A[i]==null?-1:A[i],y=B[i]==null?-1:B[i];if(x!=y)return y-x}return a-b})}
function layoutDL(){if(!DLE)return;const r=bn.getBoundingClientRect();DLE.style.cssText='left:'+(r.left+8)+'px;width:'+window.WC+'px;top:'+(board.getBoundingClientRect().bottom+6)+'px';DLE.rh=window.TOK}
function showDL(fin,rkIn,mv){if(!DLE){DLE=document.createElement('div');DLE.id='dlist';DLE.rows={};document.body.appendChild(DLE)}
layoutDL();const rk=rkIn||rankList(),rh=DLE.rh;let pl=0;
rk.forEach((k,idx)=>{let r=DLE.rows[k];const nw=!r;
if(nw){r=DLE.rows[k]=document.createElement('div');r.className='dr';r.style.color=COL[k];r.innerHTML='<b class="rp"></b><i class="rd" style="background:'+COL[k]+'"></i><span class="rv"></span>';DLE.appendChild(r);r.style.opacity=0;r.style.transform='translateY('+idx*rh+'px) scale(.5)'}
if(fin||idx==0||(DRES[rk[idx-1]]||[]).join()!=(DRES[k]||[]).join())pl=idx;
r.children[0].textContent=ROM[pl];r.children[2].innerHTML=mv?(P[k].done?'<b class="mc">'+P[k].st.n+'</b>':''):(()=>{const h=DRES[k]||[];return (h.length>2?[h[0],h[h.length-1]]:h).map(dieImg).join('<b class="ar">→</b>')})();
requestAnimationFrame(()=>requestAnimationFrame(()=>{r.style.opacity=1;r.style.transform='translateY('+idx*rh+'px) scale(1)'}))})}
function hideDL(){if(!DLE)return;const d=DLE;d.style.transition='opacity .7s';d.style.opacity=0;setTimeout(()=>{d.remove();if(DLE===d)DLE=null},750)}


function again(){location.reload()}
</script></body></html>
